[package]
name = "forja-gui-rt"
version = "0.1.0"
edition = "2021"
description = "Forja GUI Runtime — Runtime de GUI Material You (Material 3) sobre xilem para apps Forja y Rust"
license = "MIT"
repository = "https://github.com/forja-lang/forja"
homepage = "https://forja-lang.github.io/forja/"
documentation = "https://docs.rs/forja-gui-rt"
readme = "README.md"
keywords = ["gui", "material", "material-you", "xilem", "forja"]
categories = ["gui", "graphics"]
exclude = ["examples/*.fa"]

[dependencies]
forja-theme = { version = "0.1.0", path = "../forja-theme", features = ["xilem"] }
forja-gui-core = { version = "0.1.0", path = "../forja-gui-core" }
xilem = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
forja-syntax = { version = "0.9.3", path = "../forja-syntax" }
chrono = "0.4"
qrcode = "0.14"
image = "0.25"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15"

[target.'cfg(target_os = "android")'.dependencies.winit]
version = "0.30.13"
features = ["android-native-activity"]
